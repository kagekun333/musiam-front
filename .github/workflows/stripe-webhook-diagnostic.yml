name: Stripe webhook diagnostic

on:
  push:
    branches:
      - diag/stripe-webhook-20260914

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_VALUE: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_VALUE: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check diagnostic secret availability without exposing values
        shell: bash
        run: |
          check() {
            name="$1"; value="$2"
            if [ -n "$value" ]; then echo "${name}=present"; else echo "${name}=absent"; fi
          }
          check STRIPE_WEBHOOK_SECRET "${WEBHOOK_SECRET:-}"
          check STRIPE_SECRET_KEY "${STRIPE_KEY:-}"
          check VERCEL_TOKEN "${VERCEL_TOKEN_VALUE:-}"
          check VERCEL_ORG_ID "${VERCEL_ORG_VALUE:-}"
          check VERCEL_PROJECT_ID "${VERCEL_PROJECT_VALUE:-}"
